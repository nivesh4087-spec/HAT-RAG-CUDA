<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#261724"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
  </defs>
  <text x="500" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="800">HAT-RAG SYSTEM METHODOLOGY ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#8b949e" font-size="13">Hierarchical Abstract Tree with PyTorch CUDA GPU Vector Acceleration</text>
  <path d="M 500 295 C 500 200, 500 170, 500 155" stroke="#ff4b6e" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M 610 320 C 720 320, 750 200, 770 170" stroke="#30d158" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M 610 350 C 730 350, 750 450, 780 475" stroke="#f0883e" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M 390 320 C 270 320, 240 200, 220 170" stroke="#a371f7" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M 390 340 C 270 340, 250 450, 220 475" stroke="#58a6ff" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M 500 375 C 500 460, 500 520, 500 555" stroke="#e3b341" stroke-width="3" fill="none" opacity="0.85" />
  <g transform="translate(370, 295)">
    <rect x="0" y="0" width="260" height="85" rx="22" ry="22" fill="url(#hub-bg)" stroke="#ff4b6e" stroke-width="2.5" filter="url(#glow-red)" />
    <circle cx="235" cy="22" r="5" fill="#ff4b6e" />
    <text x="130" y="45" text-anchor="middle" fill="#ff4b6e" font-size="20" font-weight="800">HAT-RAG Core</text>
    <text x="130" y="64" text-anchor="middle" fill="#8b949e" font-size="12">Hierarchical Engine</text>
  </g>
  <g transform="translate(370, 95)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#ff4b6e" stroke-width="2.5" filter="url(#glow-red)" />
    <circle cx="235" cy="22" r="5" fill="#ff4b6e" />
    <text x="22" y="34" fill="#ff4b6e" font-size="16" font-weight="800">Phase 1: Ingestion</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Parser & Chunker</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Recursive Overlapping</text>
  </g>
  <g transform="translate(650, 140)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#30d158" stroke-width="2.5" filter="url(#glow-green)" />
    <circle cx="235" cy="22" r="5" fill="#30d158" />
    <text x="22" y="34" fill="#30d158" font-size="16" font-weight="800">Phase 4: CUDA Engine</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">PyTorch GPU Accelerator</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Parallel Cosine Matrix</text>
  </g>
  <g transform="translate(660, 445)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#f0883e" stroke-width="2.5" filter="url(#glow-orange)" />
    <circle cx="235" cy="22" r="5" fill="#f0883e" />
    <text x="22" y="34" fill="#f0883e" font-size="16" font-weight="800">Phase 5: Search</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Top-Down Traversal</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">O(k log N) Pruning</text>
  </g>
  <g transform="translate(90, 140)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#a371f7" stroke-width="2.5" filter="url(#glow-purple)" />
    <circle cx="235" cy="22" r="5" fill="#a371f7" />
    <text x="22" y="34" fill="#a371f7" font-size="16" font-weight="800">Phase 2 & 3: HAT Index</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Vector Clustering</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">K-Means Summaries</text>
  </g>
  <g transform="translate(80, 445)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#58a6ff" stroke-width="2.5" filter="url(#glow-blue)" />
    <circle cx="235" cy="22" r="5" fill="#58a6ff" />
    <text x="22" y="34" fill="#58a6ff" font-size="16" font-weight="800">Phase 6: LLM Generator</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Context Assembly</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Source Citations [1]</text>
  </g>
  <g transform="translate(370, 555)">
    <rect x="0" y="0" width="260" height="60" rx="18" ry="18" fill="url(#card-bg)" stroke="#e3b341" stroke-width="2.5" filter="url(#glow-yellow)" />
    <circle cx="235" cy="22" r="5" fill="#e3b341" />
    <text x="22" y="34" fill="#e3b341" font-size="16" font-weight="800">Phase 7: Benchmarks</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Latency & Speedup</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Evaluation Suite</text>
  </g>
</svg>