[server]
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#2a6fd0"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efeb"
textColor = "#1d1d1b"
borderColor = "#e3e2dc"
showWidgetBorder = true
baseRadius = "0.55rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#f2f1ed"
secondaryBackgroundColor = "#e9e8e3"
