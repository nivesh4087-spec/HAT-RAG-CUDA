<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#261724"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
  </defs>
  <text x="500" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="800">50% MILESTONE VS 100% PRODUCTION SYSTEM</text>
  <text x="500" y="70" text-anchor="middle" fill="#8b949e" font-size="13">Baseline RAG vs CUDA-Accelerated Hierarchical Abstract Tree (HAT-RAG)</text>
  <path d="M 380 320 C 260 320, 240 180, 220 155" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6,4" fill="none" opacity="0.85" />
  <path d="M 380 350 C 260 350, 240 480, 220 505" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6,4" fill="none" opacity="0.85" />
  <path d="M 620 320 C 740 320, 760 180, 780 155" stroke="#30d158" stroke-width="3" fill="none" opacity="0.9" />
  <path d="M 620 350 C 740 350, 760 480, 780 505" stroke="#30d158" stroke-width="3" fill="none" opacity="0.9" />
  <g transform="translate(365, 295)">
    <rect x="0" y="0" width="270" height="85" rx="22" ry="22" fill="url(#hub-bg)" stroke="#e3b341" stroke-width="2.5" filter="url(#glow-yellow)" />
    <circle cx="245" cy="22" r="5" fill="#e3b341" />
    <text x="135" y="45" text-anchor="middle" fill="#e3b341" font-size="20" font-weight="800">50% Milestone Hub</text>
    <text x="135" y="64" text-anchor="middle" fill="#8b949e" font-size="12">Evolution Snapshot</text>
  </g>
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="5,4" />
    <circle cx="285" cy="22" r="5" fill="#e3b341" />
    <text x="22" y="34" fill="#e3b341" font-size="16" font-weight="800">50%: Flat Vector Index</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Unstructured 1D Matrix</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Linear Search O(N) | Context Noise</text>
  </g>
  <g transform="translate(50, 465)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="5,4" />
    <circle cx="285" cy="22" r="5" fill="#e3b341" />
    <text x="22" y="34" fill="#e3b341" font-size="16" font-weight="800">50%: Single Thread CPU</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Basic Python Dot Product</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Latency ~45ms | Uncited Text</text>
  </g>
  <g transform="translate(640, 115)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#30d158" stroke-width="2.5" filter="url(#glow-green)" />
    <circle cx="285" cy="22" r="5" fill="#30d158" />
    <text x="22" y="34" fill="#30d158" font-size="16" font-weight="800">100%: Hierarchical Tree</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Multi-Tier Abstract Clustering</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Log Search O(k log N) | 70% Pruning</text>
  </g>
  <g transform="translate(640, 465)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#30d158" stroke-width="2.5" filter="url(#glow-green)" />
    <circle cx="285" cy="22" r="5" fill="#30d158" />
    <text x="22" y="34" fill="#30d158" font-size="16" font-weight="800">100%: PyTorch CUDA GPU</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Parallel Tensor Matrix Engine</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Latency ~8.4ms (5.38x) | Citation Tags</text>
  </g>
</svg>