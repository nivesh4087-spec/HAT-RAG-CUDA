<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#261724"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
  </defs>
  <text x="500" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="800">4 RAG ALGORITHMIC APPROACHES ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#8b949e" font-size="13">Comparative Multi-Approach Vector Retrieval Engine (hat_rag/src/multi_approach.py)</text>
  <path d="M 600 320 C 720 320, 740 180, 760 155" stroke="#30d158" stroke-width="3" fill="none" opacity="0.9" />
  <path d="M 600 350 C 720 350, 740 480, 760 505" stroke="#58a6ff" stroke-width="3" fill="none" opacity="0.9" />
  <path d="M 400 320 C 280 320, 260 180, 240 155" stroke="#a371f7" stroke-width="3" fill="none" opacity="0.9" />
  <path d="M 400 350 C 280 350, 260 480, 240 505" stroke="#f0883e" stroke-width="3" fill="none" opacity="0.9" />
  <g transform="translate(370, 295)">
    <rect x="0" y="0" width="260" height="85" rx="22" ry="22" fill="url(#hub-bg)" stroke="#ff79c6" stroke-width="2.5" filter="url(#glow-pink)" />
    <circle cx="235" cy="22" r="5" fill="#ff79c6" />
    <text x="130" y="45" text-anchor="middle" fill="#ff79c6" font-size="20" font-weight="800">Multi-Approach Hub</text>
    <text x="130" y="64" text-anchor="middle" fill="#8b949e" font-size="12">Comparative Engine</text>
  </g>
  <g transform="translate(630, 115)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#30d158" stroke-width="2.5" filter="url(#glow-green)" />
    <circle cx="285" cy="22" r="5" fill="#30d158" />
    <text x="22" y="34" fill="#30d158" font-size="16" font-weight="800">Approach 1: HAT-RAG</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Top-Down Logarithmic Traversal</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Complexity: O(k log N) | Nodes: ~25%</text>
  </g>
  <g transform="translate(630, 465)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#58a6ff" stroke-width="2.5" filter="url(#glow-blue)" />
    <circle cx="285" cy="22" r="5" fill="#58a6ff" />
    <text x="22" y="34" fill="#58a6ff" font-size="16" font-weight="800">Approach 2: Flat Vector RAG</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Global Brute-Force Cosine Scan</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Complexity: O(N) | Nodes: 100% Leafs</text>
  </g>
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#a371f7" stroke-width="2.5" filter="url(#glow-purple)" />
    <circle cx="285" cy="22" r="5" fill="#a371f7" />
    <text x="22" y="34" fill="#a371f7" font-size="16" font-weight="800">Approach 3: Graph-RAG</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Entity Relation Traversal</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Complexity: O(V + E) | Knowledge Graph</text>
  </g>
  <g transform="translate(60, 465)">
    <rect x="0" y="0" width="310" height="80" rx="18" ry="18" fill="url(#card-bg)" stroke="#f0883e" stroke-width="2.5" filter="url(#glow-orange)" />
    <circle cx="285" cy="22" r="5" fill="#f0883e" />
    <text x="22" y="34" fill="#f0883e" font-size="16" font-weight="800">Approach 4: RAPTOR-Style RAG</text>
    <text x="22" y="52" fill="#f0f6fc" font-size="12" font-weight="600">Collapsed Multi-Level Indexing</text>
    <text x="22" y="68" fill="#8b949e" font-size="11">Complexity: O(N_all) | Flattened Scan</text>
  </g>
</svg>